# Copy to config.yaml and adjust. Relative paths are resolved from this
# file's folder.

# Timezone used only for display and for the API's ?date= filter. The database stores UTC.
timezone: America/Fortaleza

courts:
  - id: court1                # used in file names and in the API: [a-z0-9_-]
    name: Court 1
    # IP Webcam (Android): use the RTSP H.264 stream, not MJPEG.
    # stream_url: rtsp://192.168.0.50:8080/h264_ulaw.sdp
    stream_url: rtsp://127.0.0.1:8554/court1   # scripts/fake_camera.sh
    trigger_key: f9           # pynput key name (f9, space, enter...) or one character; avoid keys people type

capture:
  segment_s: 2                # target length; with -c copy the actual cut happens at keyframes
  buffer_minutes: 10          # how much history to keep per court
  latency_offset_s: 1.0       # estimated stream delay (segment time - delay = real time)
  audio: true                 # false drops audio (-an); true transcodes it to AAC
  rtsp_transport: tcp
  reconnect_min_s: 1
  reconnect_max_s: 30
  stall_timeout_s: 15         # no new segment for this long = restart ffmpeg

clip:
  duration_s: 30              # seconds before the trigger
  post_roll_s: 3              # seconds after the trigger
  # copy              -> no re-encoding (fast, cuts are exact only at keyframes)
  # libx264           -> CPU re-encoding (exact, heavy on the i3)
  # h264_vaapi        -> re-encoding with Intel Quick Sync (Ubuntu)
  # h264_videotoolbox -> hardware re-encoding on macOS (development only)
  encoder: copy
  vaapi_device: /dev/dri/renderD128

trigger:
  debounce_s: 5               # ignore new triggers for the same court within this interval

paths:
  segments_dir: data/segments
  clips_dir: data/clips
  logs_dir: data/logs          # one file per service, rotated daily
  status_dir: data/status      # service heartbeats read by the API (/api/v1/status)

api:
  host: 127.0.0.1
  port: 8000
  cors_origins:
    - http://localhost:3000   # future Next.js app
